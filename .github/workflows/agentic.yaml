name: agentic

on: workflow_dispatch

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Black
        run: |
          pip install black==23.7.0
          black --check --diff --color .
